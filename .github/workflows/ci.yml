name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded push's run is dead weight on the macOS runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: xcode-27  # Xcode 27 image (public preview): the app icon is an Xcode 27 Icon Composer file
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Pinned to the release Xcode that builds the shipped app (27.0, 27A266a).
      # The app icon is an Xcode 27 Icon Composer file (Xcode 26's actool
      # crashes on it), and the image's newest Xcode (27.2) is a beta.
      - name: Select Xcode 27.0
        run: |
          DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version | grep -qx 'Build version 27A266a'

      # MLX compiles its Metal kernels from source; the toolchain component is
      # not preinstalled on runner images.
      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain | tail -1

      - name: Build
        run: >
          xcodebuild build
          -project bulletproof.xcodeproj
          -scheme bulletproof
          -configuration Debug
          -destination 'platform=macOS'
          -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # Parallel test workers intermittently crash at bootstrap on these
      # runners (whole worker's tests fail at 0.000s, no diagnostics, rerun
      # passes). The suite runs in ~40s, so parallelism buys nothing - run
      # one worker, and keep the result bundle for a crash report.
      - name: Test
        run: >
          xcodebuild test
          -project bulletproof.xcodeproj
          -scheme bulletproof
          -only-testing:bulletproofTests
          -destination 'platform=macOS'
          -parallel-testing-enabled NO
          -resultBundlePath TestResults.xcresult
          -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # The vendored speech engine's Swift wrapper (pass splitting); the
      # real-model tests skip without WHISTLE_MODEL.
      - name: Test Needle package
        run: swift test --package-path Packages/Needle

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7

      - name: Services end-to-end
        run: |
          BUILT=$(xcodebuild -project bulletproof.xcodeproj -scheme bulletproof -configuration Debug \
            -destination 'platform=macOS' -showBuildSettings \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>/dev/null \
            | awk '/ BUILT_PRODUCTS_DIR =/{print $3; exit}')
          Scripts/services-e2e.sh "$BUILT/bulletproof.app"
