name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select latest Xcode 26
        run: |
          DEVELOPER_DIR="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

      - name: Build
        run: >
          xcodebuild build
          -project bulletproof.xcodeproj
          -scheme bulletproof
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Test
        run: >
          xcodebuild test
          -project bulletproof.xcodeproj
          -scheme bulletproof
          -only-testing:bulletproofTests
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Services end-to-end
        run: |
          BUILT=$(xcodebuild -project bulletproof.xcodeproj -scheme bulletproof -configuration Debug \
            -destination 'platform=macOS' -showBuildSettings \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>/dev/null \
            | awk '/ BUILT_PRODUCTS_DIR =/{print $3; exit}')
          Scripts/services-e2e.sh "$BUILT/bulletproof.app"
